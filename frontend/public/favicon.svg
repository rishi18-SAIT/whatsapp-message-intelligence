  <path d="M22 15l-1 5h4l-5 8 1-5h-4l5-8z" fill="url(#spark)" stroke="#4f46e5" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Three dots for chat -->
  <circle cx="20" cy="28" r="1.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="25" cy="28" r="1.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="30" cy="28" r="1.5" fill="#6366f1" opacity="0.5"/>
  <!-- Small sparkle accents -->
